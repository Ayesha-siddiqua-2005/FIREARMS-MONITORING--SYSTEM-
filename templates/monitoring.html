<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Monitoring — SENTINEL AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body data-page="monitoring">

  <!-- ═══ TOP NAVIGATION ═══ -->
  <nav class="topnav" id="topnav">
    <div class="nav-brand">
      <span class="brand-icon">⬡</span>
      <a href="{{ url_for('index') }}" class="brand-text">SENTINEL<span class="accent">AI</span></a>
    </div>
    <button class="nav-hamburger" id="navHamburger" aria-label="Menu">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="{{ url_for('index') }}" class="nav-link" data-page="home">Home</a>
      <a href="{{ url_for('detection_page') }}" class="nav-link" data-page="detection">Detection</a>
      <a href="{{ url_for('monitoring_page') }}" class="nav-link" data-page="monitoring">Monitoring</a>
      <a href="{{ url_for('crime_map_page') }}" class="nav-link" data-page="crimemap">Crime Map</a>
      <a href="{{ url_for('alerts_page') }}" class="nav-link" data-page="alerts">Alerts</a>
      <a href="{{ url_for('analytics_page') }}" class="nav-link" data-page="analytics">Analytics</a>
      <a href="{{ url_for('guide_page') }}" class="nav-link" data-page="guide">Guide</a>
      <a href="{{ url_for('about_page') }}" class="nav-link" data-page="about">About</a>
    </div>
    <div class="nav-actions">
      <button class="nav-icon-btn" id="voiceToggle" title="Toggle Voice Alerts">
        <span id="voiceIcon">🔊</span>
      </button>
      <button class="theme-toggle-btn" id="themeToggle" title="Toggle Theme">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </nav>

  <!-- ═══ MONITORING PAGE ═══ -->
  <main class="main-content">
    <div class="page-inner">
      <h1 class="page-heading">📹 Live Monitoring</h1>
      <p class="page-sub">Real-time webcam surveillance with AI-powered firearm detection overlay.</p>

      <div class="monitoring-container">
        <!-- Video Feed -->
        <div class="glass video-feed scan-active" id="videoFeed">
          <img id="webcamVideo" alt="Live Stream" style="width:100%;height:100%;object-fit:cover;" />
          <canvas id="monitorCanvas"></canvas>
          <div class="tactical-viewfinder">
            <div class="viewfinder-corner tl"></div>
            <div class="viewfinder-corner tr"></div>
            <div class="viewfinder-corner bl"></div>
            <div class="viewfinder-corner br"></div>
            <div class="scan-laser"></div>
          </div>
          <div class="radar-sweep"></div>
          <div class="feed-overlay">
            <span class="feed-label" id="feedLabel">● LIVE</span>
            <span class="feed-fps" id="feedFps">0 FPS</span>
          </div>
        </div>

        <!-- Threat Panel -->
        <div class="glass threat-panel" id="threatPanel">
          <h3>THREAT ASSESSMENT</h3>

          <div class="threat-ring safe" id="threatRing">
            <span class="threat-text" id="threatText">SAFE</span>
          </div>

          <div class="threat-details">
            <div class="detail-row">
              <span>Status</span>
              <span class="safe-text" id="detailStatus">All Clear</span>
            </div>
            <div class="detail-row">
              <span>Detections</span>
              <span id="detailDetections">0</span>
            </div>
            <div class="detail-row">
              <span>Frame Rate</span>
              <span id="detailFps">—</span>
            </div>
            <div class="detail-row">
              <span>Uptime</span>
              <span id="detailUptime">00:00:00</span>
            </div>
          </div>

          <div style="width:100%;margin-top:0.8rem;display:flex;align-items:center;gap:0.5rem;">
            <input type="checkbox" id="soundAlertsToggle" />
            <label for="soundAlertsToggle">Enable Sound Alerts</label>
          </div>

          <div style="display:flex;gap:0.6rem;width:100%;margin-top:0.8rem;">
            <button class="btn btn-primary" id="btnStartMonitor" style="flex:1;">▶ START</button>
            <button class="btn btn-danger" id="btnStopMonitor" style="flex:1;" disabled>⏹ STOP</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}?v=20260315-1"></script>
  <script>
    window.lastSpokenState = false;
  </script>
</body>
</html>
