<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crime Map — SENTINEL AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body data-page="crimemap">

  <!-- ═══ TOP NAVIGATION ═══ -->
  <nav class="topnav" id="topnav">
    <div class="nav-brand">
      <span class="brand-icon">⬡</span>
      <a href="{{ url_for('index') }}" class="brand-text">SENTINEL<span class="accent">AI</span></a>
    </div>
    <button class="nav-hamburger" id="navHamburger" aria-label="Menu">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="{{ url_for('index') }}" class="nav-link" data-page="home">Home</a>
      <a href="{{ url_for('detection_page') }}" class="nav-link" data-page="detection">Detection</a>
      <a href="{{ url_for('monitoring_page') }}" class="nav-link" data-page="monitoring">Monitoring</a>
      <a href="{{ url_for('crime_map_page') }}" class="nav-link" data-page="crimemap">Crime Map</a>
      <a href="{{ url_for('alerts_page') }}" class="nav-link" data-page="alerts">Alerts</a>
      <a href="{{ url_for('analytics_page') }}" class="nav-link" data-page="analytics">Analytics</a>
      <a href="{{ url_for('guide_page') }}" class="nav-link" data-page="guide">Guide</a>
      <a href="{{ url_for('about_page') }}" class="nav-link" data-page="about">About</a>
    </div>
    <div class="nav-actions">
      <button class="nav-icon-btn" id="voiceToggle" title="Toggle Voice Alerts">
        <span id="voiceIcon">🔊</span>
      </button>
      <button class="theme-toggle-btn" id="themeToggle" title="Toggle Theme">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </nav>

  <!-- ═══ CRIME MAP PAGE ═══ -->
  <main class="main-content">
    <div class="page-inner">
      <h1 class="page-heading">🌐 Crime Map</h1>
      <p class="page-sub">Global firearm-related incident tracking powered by AI surveillance networks.</p>

      <div class="glass map-wrapper" style="padding:0;overflow:hidden;position:relative;">
        <div class="map-data-badge">Displaying Data: 2024 – Present</div>
        <div id="crimeMap" style="height:520px;border-radius:var(--radius-lg);"></div>
      </div>

      <div class="map-legend">
        <div class="legend-item"><span class="legend-dot high"></span> High Volume (&gt;150)</div>
        <div class="legend-item"><span class="legend-dot medium"></span> Medium Volume (75–150)</div>
        <div class="legend-item"><span class="legend-dot low"></span> Low Volume (&lt;75)</div>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
